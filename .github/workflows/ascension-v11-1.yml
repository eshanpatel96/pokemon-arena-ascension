name: V11.1 gameplay build - compact bosses, roster and campus
on:
  push:
    branches: [v11-1-beta]
    paths: ['.github/workflows/ascension-v11-1.yml', 'bootstrap/v11-1/**']
  workflow_dispatch:
concurrency:
  group: ascension-v11-1-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: V11-1-ASSEMBLED-SOURCE
          run-id: 37959084673
          github-token: ${{ github.token }}
          path: baseline
      - uses: actions/download-artifact@v4
        with:
          name: V11-1-DEVELOPMENT-ROM-NOT-FINAL-BETA
          run-id: 37959084673
          github-token: ${{ github.token }}
          path: baseline-rom
      - name: Native dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev zlib1g-dev python3-pil libmgba-dev
      - name: Verify exact assembled baseline and apply game changes
        run: |
          echo '0812cedb0e1b9affae7d9705157ff392fad7f51211e4889f30a4e4927ae726c7  baseline/v11-1-assembled-source.tar.gz' | sha256sum -c
          tar -xzf baseline/v11-1-assembled-source.tar.gz engine
          mkdir -p delivery evidence
          python3 bootstrap/v11-1/phase2.py engine | tee evidence/phase2-static.log
          python3 bootstrap/v11-1/prepare_inputs.py engine baseline-rom/Pokemon-Arena-Ascension-V11-1-DEV.gba | tee evidence/preserved-inputs.log
          gcc -std=c99 -Wall -Wextra -Werror -I engine/include -I bootstrap/v11-1 bootstrap/v11-1/test_ai.c -o evidence/test-ai
          evidence/test-ai | tee evidence/ai-unit-tests.txt
          cp engine/v11-1-phase2-report.json engine/v11-room-manifest.json engine/v10-2-move-coverage.json engine/v11-1-preserved-build-inputs.json evidence/
          git rev-parse HEAD > evidence/source-commit.txt
      - name: Generate native maps and pinned original Arena art
        working-directory: engine
        run: |
          make -j2 -f make_tools.mk
          make -j2 generated
          for map in data/maps/Ascension*/map.json; do
            dir=$(dirname "$map")
            tools/mapjson/mapjson map emerald "$map" data/layouts/layouts.json "$dir"
            test -s "$dir/events.inc"
          done
          ./tools/arena/dev.sh assets
          python3 ../bootstrap/v11-1/deduplicate_art.py .
          cp v11-1-art-dedup-proof.json ../evidence/
      - name: Compile the changed real GBA ROM
        working-directory: engine
        run: |
          set -o pipefail
          make -j2 COMPARE=0 ARENA_LAB=0 FILE_NAME=Pokemon-Ascension-Arena-V11-1-GAMEPLAY-TEST 2>&1 | tee ../evidence/build.log
          cp Pokemon-Ascension-Arena-V11-1-GAMEPLAY-TEST.gba ../delivery/
          cp Pokemon-Ascension-Arena-V11-1-GAMEPLAY-TEST.elf Pokemon-Ascension-Arena-V11-1-GAMEPLAY-TEST.map ../evidence/
          arm-none-eabi-nm -n Pokemon-Ascension-Arena-V11-1-GAMEPLAY-TEST.elf > ../evidence/symbols.txt
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          p=Path('Pokemon-Ascension-Arena-V11-1-GAMEPLAY-TEST.gba');b=p.read_bytes()
          assert len(b)==33554432 and b[0xac:0xb0]==b'BPEE'
          m={'source_commit':os.environ['GITHUB_SHA'],'rom_sha256':hashlib.sha256(b).hexdigest(),'rom_bytes':len(b),'status':'V11.1 GAMEPLAY TEST - not full approved Beta acceptance','native_engine':'Emerald Arena 0.13.0','save_policy':'Accepted title and native save code unchanged; expanded save testing deferred by user','delta_test':'not performed by CI','new_move_profiles':0,'remaining':'Full legal move profiles and Box editor, nature service, complete interactive environments, remaining architecture, full normal campaign and Delta tests'}
          for target in ('../delivery/manifest.json','../evidence/build-manifest.json'):Path(target).write_text(json.dumps(m,indent=2)+'\n')
          Path('../delivery/README.txt').write_text('V11.1 gameplay test: compact 13 boss courts, native center mosaics, expanded campus paving/planter, batched starter catalog, rewards-only Birch, legal supported enemy loadouts and EV reset. Not the entire approved Beta. Keep your prior ROM and Delta states together. Native Save/Continue and title/menu are unchanged. Cross-ROM state compatibility is not asserted. See manifest.json for remaining work.\n')
          print(json.dumps(m,indent=2))
          PY
      - name: Native startup and actual boss/city/battle framebuffer captures
        run: |
          gcc -O2 -std=c11 -D_GNU_SOURCE -include mgba/flags.h bootstrap/v11-visual-proof.c -lmgba -o evidence/gameplay-proof
          set -o pipefail
          timeout 240 evidence/gameplay-proof delivery/Pokemon-Ascension-Arena-V11-1-GAMEPLAY-TEST.gba evidence/symbols.txt evidence/runtime 2>&1 | tee evidence/gameplay.log
      - name: Preserve evidence and fully rebuildable packed source
        if: always()
        run: |
          mkdir -p evidence
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          for p in Path('evidence').rglob('*.ppm'):
              Image.open(p).save(p.with_suffix('.png'));p.unlink()
          Path('evidence/README.txt').write_text('Actual mGBA framebuffer captures. Debugger-selected room/rank fixtures accelerate inspection; they do not prove earned progression. No extended save testing was added in this pass. Check logs and images; successful compilation/capture is not full campaign/Delta acceptance.\n')
          PY
          if [ -d engine ]; then
            tar --exclude='.git' --exclude='source' --exclude='engine/Pokemon-*.gba' --exclude='*.elf' --exclude='*.map' --exclude='build' -czf v11-1-packed-gameplay-source.tar.gz engine bootstrap docs
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V11-1-GAMEPLAY-TEST-ROM
          path: delivery/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V11-1-GAMEPLAY-EVIDENCE
          path: evidence/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: V11-1-PACKED-GAMEPLAY-SOURCE
          path: v11-1-packed-gameplay-source.tar.gz
          if-no-files-found: ignore
