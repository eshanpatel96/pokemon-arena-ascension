name: Wildlands V5 World Validation
on:
  push:
    branches: [wildlands-v5-world-validation, wildlands-v5]
    paths:
      - '.github/workflows/wildlands-v5.yml'
      - 'bootstrap/wildlands-v5/**'
      - 'bootstrap/wildlands-v4/**'
      - 'bootstrap/arena-xl/**'
      - 'docs/WILDLANDS-V5*'
      - 'docs/art/**'
      - 'bootstrap/wildlands-map/**'
  workflow_dispatch:
concurrency:
  group: wildlands-v5-world-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: write
  actions: read
jobs:
  build-world:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        world: [slice, island]
    env:
      WORLD: ${{ matrix.world }}
      # Single source of the beta version: ROM file, artifact names, manifest,
      # and the Lab sign in game. Bump this for every build sent to testers.
      WL_VERSION: '6.3'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: V11-1-ASSEMBLED-SOURCE
          run-id: 37959084673
          github-token: ${{ github.token }}
          path: baseline

      - uses: actions/download-artifact@v4
        with:
          name: V11-1-DEVELOPMENT-ROM-NOT-FINAL-BETA
          run-id: 37959084673
          github-token: ${{ github.token }}
          path: baseline-rom

      - name: Native dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev zlib1g-dev python3-pil python3-numpy libmgba-dev

      - name: Assemble exact V11.1 source
        run: |
          echo '0812cedb0e1b9affae7d9705157ff392fad7f51211e4889f30a4e4927ae726c7  baseline/v11-1-assembled-source.tar.gz' | sha256sum -c
          tar -xzf baseline/v11-1-assembled-source.tar.gz engine
          mkdir -p delivery evidence recovery
          python3 bootstrap/v11-1/phase2.py engine | tee evidence/v11-1-phase2.txt
          python3 bootstrap/v11-1/prepare_inputs.py engine baseline-rom/Pokemon-Arena-Ascension-V11-1-DEV.gba | tee evidence/preserved-inputs.txt

      - name: Apply Arena World foundation
        run: |
          set -o pipefail
          python3 bootstrap/arena-xl/apply.py engine | tee evidence/arena-xl-base.txt
          python3 bootstrap/wildlands-v4/apply.py engine | tee evidence/v4-lab-base.txt
          if [ "$WORLD" = island ]; then python3 bootstrap/wildlands-v5/generate_island.py engine | tee evidence/world-generation.json; else python3 bootstrap/wildlands-v5/generate_world.py engine | tee evidence/world-generation.json; fi
          python3 bootstrap/wildlands-v5/apply.py engine | tee evidence/v5-world-apply.txt
          python3 bootstrap/wildlands-v5/squad_apply.py engine | tee evidence/v5-squad-apply.txt
          python3 bootstrap/wildlands-v5/move_editor_apply.py engine | tee evidence/v5-move-editor.txt
          python3 bootstrap/wildlands-v5/coach_apply.py engine | tee evidence/v5-coach.txt
          python3 bootstrap/wildlands-v5/beta_apply.py engine | tee evidence/v5-beta.txt
          python3 bootstrap/wildlands-v4/generate_ui.py engine | tee evidence/ui-generation.txt
          python3 bootstrap/wildlands-v5/title.py engine | tee evidence/title.txt
          git rev-parse HEAD > evidence/source-commit.txt
          cp engine/data/wildlands_world/manifest.json evidence/world-manifest.json
          cp engine/include/wildlands_world_data.h evidence/

      - name: Generate native assets
        working-directory: engine
        run: |
          make -j2 -f make_tools.mk
          make -j2 generated
          ./tools/arena/dev.sh assets
          python3 ../bootstrap/v11-1/deduplicate_art.py .
          cp v11-1-art-dedup-proof.json ../evidence/

      - name: Audit roster and world representation
        run: |
          python3 bootstrap/wildlands-v4/audit_roster.py engine | tee evidence/roster-audit.json
          grep -q '"curated_selectable_count": 105' evidence/roster-audit.json
          grep -q '"groudon_arena_sprite": false' evidence/roster-audit.json
          if [ "$WORLD" = island ]; then
            ROWS=$(python3 -c "import json;print(json.load(open('engine/data/wildlands_world/manifest.json'))['interiors']['total_rows'])")
            test "$(stat -c %s engine/data/wildlands_world/slice.bin)" -eq $((256*ROWS*2))
            test "$(stat -c %s engine/data/wildlands_world/terrain.bin)" -eq $((256*ROWS))
            python3 -c "import json;m=json.load(open('engine/data/wildlands_world/manifest.json'));assert m['reachable_pct']>=97 and all(v['reachable_cells']>=30 and len(v['approaches'])>=2 for v in m['lairs'].values()),m;print('ISLAND REACHABILITY AUDIT PASS',m['reachable_pct']);assert all(m['doors_reachable'].values()) and len(m['interiors']['rooms'])>=8,m['doors_reachable'];print('DOOR AUDIT PASS',len(m['doors_reachable']),'doors');assert m['invisible_walls_left']==0 and m['belt_ok'],m['invisible_walls_left'];print('COVER AUDIT PASS no invisible walls, cleared',m['invisible_walls_cleared'])"
          else
          ROWS=$(python3 -c "import json;print(json.load(open('engine/data/wildlands_world/manifest.json'))['interiors']['total_rows'])")
          test "$(stat -c %s engine/data/wildlands_world/slice.bin)" -eq $((40*ROWS*2))
          test "$(stat -c %s engine/data/wildlands_world/terrain.bin)" -eq $((40*ROWS))
          python3 - <<'PY'
          from pathlib import Path
          import json
          m=json.loads(Path('engine/data/wildlands_world/manifest.json').read_text())
          assert m['world_pixels']==[4096,3072]
          assert m['validation_slice_metatiles']==[40,48]
          assert m['sources']['route120']=='data/layouts/Route120/map.bin'
          assert m['sources']['fortree']=='data/layouts/FortreeCity/map.bin'
          assert m['roles']['bridge'].startswith('walkable')
          assert len(m['interiors']['rooms'])==1 and len(m['interiors']['doors'])==1
          print('WORLD REPRESENTATION AUDIT PASS')
          PY
          fi

      - name: Compile real GBA ROM
        working-directory: engine
        run: |
          set -o pipefail
          make -j2 COMPARE=0 ARENA_LAB=0 FILE_NAME=Pokemon-WildLands-Beta-V${WL_VERSION} 2>&1 | tee ../evidence/build.log
          cp Pokemon-WildLands-Beta-V${WL_VERSION}.gba ../delivery/
          cp Pokemon-WildLands-Beta-V${WL_VERSION}.elf Pokemon-WildLands-Beta-V${WL_VERSION}.map ../evidence/
          arm-none-eabi-nm -n Pokemon-WildLands-Beta-V${WL_VERSION}.elf > ../evidence/symbols.txt

      - name: Sprite size survey (read-only)
        continue-on-error: true
        run: python3 bootstrap/wildlands-v5/sprite_survey.py engine > evidence/sprite-survey.txt 2>&1


      - name: Full island render (read-only)
        if: matrix.world == 'island'
        continue-on-error: true
        run: python3 bootstrap/wildlands-v5/render_world.py engine evidence

      - name: Build manifest and memory report
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,re
          p=Path('delivery/Pokemon-WildLands-Beta-V'+os.environ['WL_VERSION']+'.gba')
          b=p.read_bytes()
          assert len(b)==33554432 and b[0xac:0xb0]==b'BPEE'
          log=Path('evidence/build.log').read_text(errors='replace')
          mem={}
          for name,used,total,pct in re.findall(r'^\s*(EWRAM|IWRAM|ROM):\s+(\d+) B\s+(\d+) (?:KB|MB)\s+([\d.]+)%',log,re.M):
              mem[name]={'used_bytes':int(used),'usage_percent':float(pct)}
          world=os.environ.get('WORLD','slice')
          manifest={
            'name':'Pokemon WildLands Beta V'+os.environ['WL_VERSION']+' ('+world+')',
            'source_commit':os.environ['GITHUB_SHA'],
            'rom_sha256':hashlib.sha256(b).hexdigest(),
            'rom_bytes':len(b),
            'world':world,
            'world_coordinate_space_pixels':[4096,3072],
            'terrain_source':'native Emerald metatiles: General primary + streamed Fortree/Mauville/Fallarbor/Lavaridge/Slateport secondaries per biome (island); collision/material from metatile data, never a floor bitmap; no invisible walls (audited)',
            'controller':'native realtime Arena movement/dodge/attack/cooldown/hit path; fixed-timestep catch-up keeps game time real-time',
            'true_2v2':'yes (first slice): player+AI partner vs enemy lead+wing; all four attack, take damage, KO; lead KO promotes the living wing',
            'closing_zone':'world-coordinate circle, 90s explore / 45s warning / 75s shrink per phase, violet tint and edge markers, time-based exposure damage to all actors',
            'loot':'team ATK/DEF/SPD stages, cap +3; capped pickups heal 40% and restore PP',
            'live_map':'START -> MAP (storm shading, next circle, lair state)',
            'move_editor':'Lab COACH: PICK DUO, MOVES (native relearner UI, arena-supported legal moves), CONTROLS, DEPLOY; all owned Pokemon swept to arena moves',
            'title':'approved Charizard/Blastoise/Rayquaza concept at native 240x160',
            'thirty_duo_simulation':True,
            'legendary_boss_battles':True,
            'shiny_palettes':'about 1 in 64 AI Pokemon (legendaries included), native shiny data and shiny arena palette',
            'roaming_legendaries':'one dog, bird and Regi per match, staggered spawns inside the circle; beat one and it joins',
            'weather':'desert sandstorm (Rock/Ground/Steel +20%), volcano ashfall (Fire +20%), storm rain (Water +20%, Fire -20%)',
            'match_summary':'victory or eliminated, place, knockouts, time survived',
            'memory':mem,
            'verification':'mGBA automated runtime only; iPhone Delta requires owner playtest'
          }
          Path('delivery/manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          Path('delivery/README.txt').write_text(
            'Pokemon WildLands Beta V'+os.environ['WL_VERSION']+' ('+world+'). NEW GAME -> Research Lab. Talk to the COACH: PICK DUO (two Pokemon), '
            'MOVES (only moves the arena animates), CONTROLS, DEPLOY. L+R in the Lab also deploys. '
            'In match: D-pad move, A attack, B+direction dodge, L/R change move, L+R throw a ball, SELECT swap lead and partner, '
            'START pause (TEAM, LOG, MOVES, MAP). Stand still out of combat to heal. Stay inside the circle. '
            + ('Full island: 30 duos, five legendary lairs (bosses), three roaming legendaries, desert sandstorm and volcano ashfall, houses with supplies. ' if world=='island' else 'Route 120 validation slice. ')
            + 'Automated mGBA tests only; please report how it feels on Delta.\n')
          Path('evidence/build-manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print(json.dumps(manifest,indent=2))
          PY

      - name: mGBA world gameplay smoke
        run: |
          gcc -O2 -std=c11 -D_GNU_SOURCE -include mgba/flags.h bootstrap/wildlands-v5/wl_smoke.c -lmgba -o evidence/wildlands-v5-smoke
          set +e
          set -o pipefail
          CMDS=bootstrap/wildlands-v5/smoke.commands; [ "$WORLD" = island ] && CMDS=bootstrap/wildlands-v5/smoke_island.commands
          timeout 1500 evidence/wildlands-v5-smoke delivery/Pokemon-WildLands-Beta-V${WL_VERSION}.gba evidence/symbols.txt evidence/runtime $CMDS - 2>&1 | tee evidence/smoke.log
          rc=$?
          python3 - <<'PY2'
          from pathlib import Path
          from PIL import Image
          for p in Path('evidence/runtime').glob('*.ppm'):
              Image.open(p).save(p.with_suffix('.png')); p.unlink()
          PY2
          grep -c "CHECK FAIL" evidence/smoke.log | xargs -I{} echo "::notice::smoke failed checks: {}"
          grep "CHECK FAIL" evidence/smoke.log | head -10 | sed 's/^/::notice::/'
          # Gate results are a ledger, not a red build: failed checks exit 1
          # and are reported above; only a harness/emulator crash fails CI.
          if [ "$rc" -ge 2 ]; then exit $rc; fi
          exit 0

      - name: Recovery package
        if: always()
        run: |
          mkdir -p recovery/src recovery/include recovery/data/wildlands_world recovery/bootstrap
          cp bootstrap/wildlands-v5/*.py bootstrap/wildlands-v5/*.c bootstrap/wildlands-v5/*.h bootstrap/wildlands-v5/*.commands recovery/bootstrap/ 2>/dev/null || true
          if test -d engine; then
            cp engine/src/realtime_arena.c engine/src/arena_navigation.c engine/src/arena_terrain.c engine/src/wildlands_world.c recovery/src/ 2>/dev/null || true
            cp engine/src/arena_psychic.inc engine/src/arena_toss.inc engine/src/arena_squad.inc recovery/src/ 2>/dev/null || true
            cp engine/include/wildlands_world.h engine/include/wildlands_world_data.h recovery/include/ 2>/dev/null || true
            cp engine/data/wildlands_world/* recovery/data/wildlands_world/ 2>/dev/null || true
          fi
          cp evidence/source-commit.txt recovery/ 2>/dev/null || true
          cat > recovery/README.txt <<'EOF'
          Recovery package for the exact Wildlands V5 World Validation build.
          Reconstruct V11.1 from workflow run 37959084673, then apply:
          bootstrap/arena-xl/apply.py
          bootstrap/wildlands-v4/apply.py
          bootstrap/wildlands-v5/generate_world.py
          bootstrap/wildlands-v5/apply.py
          The patched critical source/data snapshots are included here as verification/recovery references.
          EOF

      - name: Upload ROM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WILDLANDS-BETA-V${{ env.WL_VERSION }}-${{ matrix.world }}-ROM
          path: delivery/
          if-no-files-found: ignore

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WILDLANDS-BETA-V${{ env.WL_VERSION }}-${{ matrix.world }}-EVIDENCE
          path: evidence/
          if-no-files-found: warn

      - name: Upload recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WILDLANDS-BETA-V${{ env.WL_VERSION }}-${{ matrix.world }}-RECOVERY
          path: recovery/
          if-no-files-found: warn

      - name: Publish evidence and engine source to branches
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash bootstrap/wildlands-v5/publish_evidence.sh 2>&1 | sed 's/x-access-token:[^@]*@/x-access-token:***@/g'; echo "::notice::publish exit ${PIPESTATUS[0]}"
