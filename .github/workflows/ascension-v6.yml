name: Ascension V10.2 development - legal move studio and GBA compilation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ascension-v6.yml'
      - 'bootstrap/**'
  push:
    branches: [main, v10-friends-beta, v10-1-polish, v10-2-full-test]
    paths:
      - '.github/workflows/ascension-v6.yml'
      - 'bootstrap/**'

# Prevent overlapping expensive GBA builds from consuming GitHub Actions minutes.
concurrency:
  group: ascension-gba-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out Ascension project
        uses: actions/checkout@v4

      - name: Install C, GBA, asset and map dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential git patch xz-utils gcc-arm-none-eabi binutils-arm-none-eabi libnewlib-arm-none-eabi libpng-dev zlib1g-dev python3 python3-pil perl

      - name: Fetch exact Emerald + original Arena source
        run: |
          git clone https://github.com/pret/pokeemerald.git engine
          git -C engine checkout --detach 5eff78649e7170a877b961ef0b3da13b81a16038
          git clone https://github.com/GBurgardt/pokemon-emerald-arena.git arena-upstream
          git -C arena-upstream checkout --detach e1502f9f7ed46d969880d73adbf5ab23ef7b2a56
          git -C engine apply ../arena-upstream/game/native-engine.patch
          cp -a arena-upstream/game/overlay/. engine/
          test -s engine/src/realtime_arena.c
          echo 'Original Emerald Arena native engine restored.'

      - name: Apply Ascension V6.1 city, tutorial and tower source
        run: |
          bash bootstrap/apply-ascension.sh "$GITHUB_WORKSPACE/engine" "$RUNNER_TEMP/ascension"
          grep -q '"AscensionCity"' engine/data/maps/map_groups.json
          grep -q 'Ascension_PrepareTutorial' engine/src/ascension_career.c
          grep -q 'WarpIntoMap' engine/src/realtime_arena.c
          grep -q 'MENU_ACTION_ARENA_GUIDE' engine/src/start_menu.c
          grep -q 'LAYOUT_BATTLE_FRONTIER_BATTLE_TOWER_BATTLE_ROOM' engine/data/maps/AscensionTower1/map.json
          grep -q 'ASCENSION POKEMON LAB' engine/data/maps/AscensionCity/scripts.inc
          grep -q 'Ascension_NextChallengerSprite' engine/src/ascension_career.c
          grep -q 'sThemePool\[8\]\[6\]' engine/src/ascension_career.c
          grep -q 'Ascension_ClaimTowerRewards' engine/src/ascension_career.c
          grep -q 'Ascension_RegisterStarterRoster' engine/src/ascension_career.c
          grep -q 'Ascension_ResetArenaMoves' engine/src/ascension_career.c
          grep -q 'special ChoosePartyMon' engine/data/maps/AscensionStyleHouse/scripts.inc
          test -s engine/data/maps/AscensionLeader9/map.json
          grep -q 'AscensionItemShop_BattleItems' engine/data/maps/AscensionItemShop/scripts.inc
          grep -q 'MAP_ASCENSION_BRONZE_BOSS' engine/data/maps/AscensionBronzeBoss/map.json
          grep -q 'EventScript_AscensionGuide' engine/data/ascension_guide.inc
          grep -q 'MAP_ASCENSION_ARENA_GATE_1' engine/data/maps/AscensionArenaGate1/map.json

      - name: Validate V9 source and static career invariants
        run: |
          python3 -m py_compile bootstrap/v9-release-safety.py bootstrap/v9-city-services.py bootstrap/v9-campaign-depth.py bootstrap/v9-circuit-polish.py bootstrap/v9-reward-milestones.py bootstrap/v9-ai-archetypes.py bootstrap/v9-city-architecture.py bootstrap/v9-tower-exteriors.py bootstrap/v9-championship.py bootstrap/v10-boss-approach.py bootstrap/v10-masters-circuit.py bootstrap/v10-1-court-choreography.py bootstrap/v10-1-training-services.py bootstrap/v10-1-native-town-polish.py bootstrap/v10-2-real-move-studio.py bootstrap/v10-2-stage-and-boss.py bootstrap/v10-2-boss-physics.py bootstrap/v10-2-wardrobe.py bootstrap/check-v9-invariants.py bootstrap/check-v10-friends.py
          python3 bootstrap/check-v9-invariants.py "$GITHUB_WORKSPACE/engine"
          python3 bootstrap/check-v10-friends.py "$GITHUB_WORKSPACE/engine" "$GITHUB_WORKSPACE/v10-town-visuals"

      - name: Preserve honest V10.2 species move-coverage audit
        uses: actions/upload-artifact@v4
        with:
          name: V10-2-EMERALD-ARENA-MOVE-COVERAGE
          path: engine/v10-2-move-coverage.json
          if-no-files-found: error

      - name: Export assembled V9 source and city tiles for development diagnostics
        run: |
          python3 bootstrap/v9-diagnostic-export.py "$GITHUB_WORKSPACE/engine" "$GITHUB_WORKSPACE/v9-assembled-source.zip"

      - name: Preserve assembled V9 source diagnostics
        uses: actions/upload-artifact@v4
        with:
          name: V9-ASSEMBLED-SOURCE-INSPECTION
          path: v9-assembled-source.zip
          if-no-files-found: error

      - name: Preserve clean V10 city tile previews
        uses: actions/upload-artifact@v4
        with:
          name: V10-NATIVE-CITY-VISUAL-AUDIT
          path: v10-town-visuals/*.png
          if-no-files-found: error

      - name: Install pinned agbcc compiler
        run: |
          git clone https://github.com/pret/agbcc.git agbcc
          git -C agbcc checkout --detach da598c1d918402c42c0c0d7128ba14567f3175e9
          (cd agbcc && ./build.sh && ./install.sh "$GITHUB_WORKSPACE/engine")

      - name: Generate native maps and engine helpers
        working-directory: engine
        run: |
          make -j2 -f make_tools.mk
          make -j2 generated
          tools/mapjson/mapjson map emerald data/maps/AscensionCity/map.json data/layouts/layouts.json data/maps/AscensionCity
          tools/mapjson/mapjson map emerald data/maps/AscensionTowerHall/map.json data/layouts/layouts.json data/maps/AscensionTowerHall
          for map in AscensionBronzeBoss AscensionLeader2 AscensionLeader3 AscensionLeader4 AscensionLeader5 AscensionLeader6 AscensionLeader7 AscensionLeader8 AscensionLeader9 AscensionCityEast AscensionTower1 AscensionTower2 AscensionTower3 AscensionTower4 AscensionTower5 AscensionTower6 AscensionTower7 AscensionTower8 AscensionSummit AscensionArenaGate1 AscensionArenaGate2 AscensionArenaGate3 AscensionArenaGate4 AscensionArenaGate5 AscensionArenaGate6 AscensionArenaGate7 AscensionArenaGate8 AscensionArenaGate9 AscensionTeamLab AscensionItemShop AscensionMoveStudio AscensionStyleHouse; do
            tools/mapjson/mapjson map emerald "data/maps/$map/map.json" data/layouts/layouts.json "data/maps/$map"
            test -s "data/maps/$map/events.inc"
            test -s "data/maps/$map/header.inc"
          done
          test -f data/maps/AscensionCity/events.inc
          test -f data/maps/AscensionTowerHall/events.inc

      - name: Restore original animated Pokémon and arena art
        working-directory: engine
        run: |
          # Upstream macOS packer links libpng but omits libm on Linux.
          sed -i 's/-lpng -o /-lpng -lm -o /g' tools/arena/dev.sh
          # GCC 13 warns on the upstream packers' compact if-statements.
          sed -i 's/-Werror /-Werror -Wno-error=misleading-indentation /g' tools/arena/dev.sh
          ./tools/arena/dev.sh assets
          test -s .arena-dev/art/actions.4bpp
          test -s .arena-dev/art/props.4bpp

      - name: Preserve original generated arena art (avoid mistaken PNG reconversion)
        working-directory: engine
        run: |
          cat >> Makefile <<'MAKEFILE_EOF'

          # Files created by arena packers have no equivalent source PNG.
          # Upstream implicit %.4bpp: %.png incorrectly rebuilds them on Linux.
          PREPACKED_ARENA_ASSETS := $(wildcard .arena-dev/art/*.4bpp .arena-dev/art/*.8bpp .arena-dev/art/*.gbapal .arena-dev/art/*.bin graphics/arena/oswarlin/*.8bpp graphics/arena/storm/*.8bpp graphics/arena/storm/*.gbapal)
          $(PREPACKED_ARENA_ASSETS): ; @test -s "$@"
          MAKEFILE_EOF

      - name: Compile Ascension from real Emerald Arena engine
        working-directory: engine
        run: |
          set -o pipefail
          make -j2 COMPARE=0 ARENA_LAB=0 FILE_NAME=Pokemon-Arena-Ascension 2>&1 | tee ../ascension-build.log
          test -s Pokemon-Arena-Ascension.gba
          python3 - <<'PY'
          from pathlib import Path
          rom = Path("Pokemon-Arena-Ascension.gba").read_bytes()
          assert len(rom) >= 16*1024*1024, "ROM unexpectedly small"
          assert rom[0xAC:0xB0] == b"BPEE", "Invalid Emerald game code"
          print("GBA header and ROM size valid:", len(rom))
          PY

      - name: Keep compiler log even if build fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ascension-v6-compiler-log
          path: ascension-build.log
          if-no-files-found: ignore

      - name: Publish private DELTA TEST ROM (not gameplay-verified)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Ascension-V9-DEV-UNTESTED-GBA
          path: engine/Pokemon-Arena-Ascension.gba
          if-no-files-found: error

# A successful compiler run does NOT establish a completed tower/city playthrough.
# Development branch artifacts are NOT finished V9 or Delta-verified.
# Live mGBA/Delta checks required before a player release.
