name: Wildlands V5 Gameplay Baseline
on:
  push:
    branches: [wildlands-v5-gameplay]
    paths:
      - '.github/workflows/wildlands-v4.yml'
      - 'bootstrap/wildlands-v4/**'
      - 'bootstrap/arena-xl/**'
      - 'docs/WILDLANDS-V4*'
      - 'docs/WILDLANDS-ROSTER-LOCK.md'
      - '.github/workflows/wildlands-v5-gameplay.yml'
  workflow_dispatch:
concurrency:
  group: wildlands-v5-gameplay-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  build-and-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: V11-1-ASSEMBLED-SOURCE
          run-id: 37959084673
          github-token: ${{ github.token }}
          path: baseline
      - uses: actions/download-artifact@v4
        with:
          name: V11-1-DEVELOPMENT-ROM-NOT-FINAL-BETA
          run-id: 37959084673
          github-token: ${{ github.token }}
          path: baseline-rom
      - name: Native dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential binutils-arm-none-eabi gcc-arm-none-eabi libnewlib-arm-none-eabi libpng-dev zlib1g-dev python3-pil libmgba-dev
      - name: Assemble exact V11.1 source
        run: |
          echo '0812cedb0e1b9affae7d9705157ff392fad7f51211e4889f30a4e4927ae726c7  baseline/v11-1-assembled-source.tar.gz' | sha256sum -c
          tar -xzf baseline/v11-1-assembled-source.tar.gz engine
          mkdir -p delivery evidence
          python3 bootstrap/v11-1/phase2.py engine | tee evidence/v11-1-phase2.txt
          python3 bootstrap/v11-1/prepare_inputs.py engine baseline-rom/Pokemon-Arena-Ascension-V11-1-DEV.gba | tee evidence/preserved-inputs.txt
      - name: Apply Arena World and V4
        run: |
          python3 bootstrap/arena-xl/apply.py engine | tee evidence/arena-world-base.txt
          python3 bootstrap/wildlands-v4/apply.py engine | tee evidence/wildlands-v4-apply.txt
          python3 bootstrap/wildlands-v4/generate_ui.py engine | tee evidence/ui-generation.txt
          git rev-parse HEAD > evidence/source-commit.txt
      - name: Generate native assets
        working-directory: engine
        run: |
          make -j2 -f make_tools.mk
          make -j2 generated
          ./tools/arena/dev.sh assets
          python3 ../bootstrap/arena-xl/expand-stage-map.py .
          python3 ../bootstrap/v11-1/deduplicate_art.py .
          cp v11-1-art-dedup-proof.json ../evidence/
      - name: Audit V4 roster
        run: |
          python3 bootstrap/wildlands-v4/audit_roster.py engine | tee evidence/roster-audit.json
          grep -q '"curated_selectable_count": 105' evidence/roster-audit.json
          grep -q '"groudon_arena_sprite": false' evidence/roster-audit.json
      - name: Compile real GBA ROM
        working-directory: engine
        run: |
          set -o pipefail
          make -j2 COMPARE=0 ARENA_LAB=0 FILE_NAME=Pokemon-Wildlands-V5-Gameplay-Baseline 2>&1 | tee ../evidence/build.log
          cp Pokemon-Wildlands-V5-Gameplay-Baseline.gba ../delivery/
          cp Pokemon-Wildlands-V5-Gameplay-Baseline.elf Pokemon-Wildlands-V5-Gameplay-Baseline.map ../evidence/
          arm-none-eabi-nm -n Pokemon-Wildlands-V5-Gameplay-Baseline.elf > ../evidence/symbols.txt
      - name: Manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          p=Path('delivery/Pokemon-Wildlands-V5-Gameplay-Baseline.gba'); b=p.read_bytes()
          assert len(b)==33554432 and b[0xac:0xb0]==b'BPEE'
          manifest={
            'name':'Pokemon Wildlands V5 Gameplay Baseline',
            'source_commit':os.environ['GITHUB_SHA'],
            'rom_sha256':hashlib.sha256(b).hexdigest(),
            'rom_bytes':len(b),
            'world_pixels':[4096,3072],
            'selectable_species':105,
            'boss_only_legends':['Mewtwo','Lugia','Ho-Oh','Kyogre','Rayquaza'],
            'features':[
              'Wildlands Mode-4 title screen',
              'Research Lab boot hub',
              'native PC constrained to two Pokemon',
              '105-species curated PC roster',
              'reusable Arena-supported TMs, no HMs',
              'Field Map terminal with five legendary lairs',
              'five rotating lair-themed practice grounds',
              'highlighted non-damaging AI partner movement prototype',
              'ordinary Arena sprites reduced to about 90 percent; boss legends enlarged'
            ],
            'known_limitations':[
              'practice combat remains one damageable enemy body',
              'partner movement/formation is implemented but partner damage is not yet part of four-body combat',
              'full 30-team simulation and legendary boss mechanics are not implemented in V4 Alpha'
            ]
          }
          Path('delivery/manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          Path('delivery/README.txt').write_text(
            'Pokemon Wildlands V5 Gameplay Baseline (V4-equivalent; new V5 features NOT YET implemented). Start NEW GAME to enter the Research Lab. '
            'Use the native PC for a two-Pokemon squad. Left lab terminals show the Field Map; '
            'the scientist queues practice. L+R remains a developer shortcut for practice. '
            'V4 Alpha tests title/lab flow, 105-species roster, reusable TMs, 4096x3072 Arena World, '
            'smaller combatants and highlighted partner movement. Partner combat and 30-team simulation are not yet complete.\n')
          Path('evidence/build-manifest.json').write_text(json.dumps(manifest,indent=2)+'\n')
          print(json.dumps(manifest,indent=2))
          PY
      - name: mGBA title lab partner smoke
        run: |
          gcc -O2 -std=c11 -D_GNU_SOURCE -include mgba/flags.h bootstrap/v11-smoke.c -lmgba -o evidence/wildlands-v4-smoke
          set -o pipefail
          timeout 260 evidence/wildlands-v4-smoke delivery/Pokemon-Wildlands-V5-Gameplay-Baseline.gba evidence/symbols.txt evidence/runtime bootstrap/wildlands-v4/smoke.commands - 2>&1 | tee evidence/smoke.log
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          for p in Path('evidence/runtime').glob('*.ppm'):
              Image.open(p).save(p.with_suffix('.png')); p.unlink()
          PY
      - name: Upload ROM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WILDLANDS-V5-GAMEPLAY-BASELINE-ROM
          path: delivery/
          if-no-files-found: ignore
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WILDLANDS-V5-GAMEPLAY-BASELINE-EVIDENCE
          path: evidence/
          if-no-files-found: warn
